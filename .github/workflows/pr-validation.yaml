name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  PR Validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect operations-center changes
        id: detect
        shell: bash
        run: |
          set -e

          git fetch origin "${{ github.base_ref }}" --depth=1
          DIFF_RANGE="origin/${{ github.base_ref }}...HEAD"

          CHANGED_FILES=$(git diff --name-only $DIFF_RANGE || true)

          if echo "$CHANGED_FILES" | grep -q "^operations-center/"; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.detect.outputs.run_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: operations-center/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: operations-center
        run: npm ci

      - name: Run tests
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: operations-center
        run: npm run test

      - name: Skip notice
        if: steps.detect.outputs.run_tests == 'false'
        run: echo "No operations-center changes. Skipping tests."
