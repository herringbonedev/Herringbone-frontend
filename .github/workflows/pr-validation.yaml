name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  detect-changes:
    name: Detect operations-center changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -e

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
            DIFF_RANGE="$BASE...HEAD"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi

          echo "Diff range: $DIFF_RANGE"

          CHANGED_FILES=$(git diff --name-only $DIFF_RANGE || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "^operations-center/"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  operations-center-tests:
    name: operations-center tests
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: operations-center

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: operations-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  auto-pass:
    name: No operations-center changes
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to validate
        run: echo "No changes in operations-center. Skipping tests."
