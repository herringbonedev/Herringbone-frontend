name: PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Detect operations-center changes
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "^operations-center/"; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.detect.outputs.run_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: operations-center/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: operations-center
        run: npm ci

      - name: Run operations-center tests
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: operations-center
        run: npm run test

      - name: Auto-pass
        if: steps.detect.outputs.run_tests == 'false'
        run: echo "No operations-center changes. Validation passed."
