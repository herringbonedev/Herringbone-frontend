name: Candidate Release

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      kustomization_path:
        required: true
        type: string
      image_repo:
        required: true
        type: string

      publish_npm_package:
        required: false
        type: boolean
        default: false
      package_path:
        required: false
        type: string
        default: ''
      package_name:
        required: false
        type: string
        default: ''
      package_scope:
        required: false
        type: string
        default: ''
      package_registry:
        required: false
        type: string
        default: 'https://npm.pkg.github.com'
      node_version:
        required: false
        type: string
        default: '22'

      candidate_base_version:
        required: false
        type: string
        default: '0.1.0'
      candidate_channel:
        required: false
        type: string
        default: alpha

permissions:
  contents: write
  pull-requests: write
  packages: write
  checks: write
  id-token: write

concurrency:
  group: candidate-release-${{ inputs.service_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-release:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.HERRINGBONE_ACTIONS_BOT }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute candidate metadata
        id: meta
        uses: ./.github/actions/candidate-metadata
        with:
          candidate_base_version: ${{ inputs.candidate_base_version }}
          candidate_channel: ${{ inputs.candidate_channel }}

      - name: Validate candidate version
        uses: ./.github/actions/validate-candidate-version
        with:
          release_version: ${{ steps.meta.outputs.release_version }}
          candidate_version: ${{ steps.meta.outputs.package_version }}
          package_name: ${{ inputs.package_name }}
          package_scope: ${{ inputs.package_scope }}
          package_registry: ${{ inputs.package_registry }}
          npm_token: ${{ github.token }}

      - name: Build and publish candidate npm package
        id: npm
        if: inputs.publish_npm_package == true
        uses: ./.github/actions/npm-candidate-package
        with:
          package_path: ${{ inputs.package_path }}
          package_name: ${{ inputs.package_name }}
          package_scope: ${{ inputs.package_scope }}
          package_registry: ${{ inputs.package_registry }}
          package_version: ${{ steps.meta.outputs.package_version }}
          node_version: ${{ inputs.node_version }}
          npm_token: ${{ github.token }}

      - name: Build, push, and sign image
        id: image
        uses: ./.github/actions/docker-build-push-sign
        with:
          image_repo: ${{ inputs.image_repo }}
          tag: ${{ steps.meta.outputs.short_sha }}
          dockerfile: ${{ inputs.dockerfile }}
          service_path: ${{ inputs.service_path }}

      - name: Create candidate tag
        id: candidate_tag
        uses: ./.github/actions/create-candidate-tag
        with:
          tag_name: ${{ steps.meta.outputs.candidate_tag }}
          service_name: ${{ inputs.service_name }}
          package_name: ${{ inputs.package_name }}
          package_version: ${{ steps.meta.outputs.package_version }}
          image_repo: ${{ inputs.image_repo }}
          image_tag: ${{ steps.meta.outputs.short_sha }}
          image_digest: ${{ steps.image.outputs.digest }}

      - name: Update candidate manifests
        id: manifests
        uses: ./.github/actions/update-candidate-manifests
        with:
          service_name: ${{ inputs.service_name }}
          image_repo: ${{ inputs.image_repo }}
          image_tag: ${{ steps.meta.outputs.short_sha }}
          image_digest: ${{ steps.image.outputs.digest }}
          kustomization_path: ${{ inputs.kustomization_path }}
          package_name: ${{ inputs.package_name }}
          package_version: ${{ steps.meta.outputs.package_version }}
          candidate_channel: ${{ inputs.candidate_channel }}

      - name: Create candidate release PR
        if: steps.manifests.outputs.changed == 'true' || steps.npm.outputs.changed == 'true'
        uses: ./.github/actions/create-candidate-pr
        with:
          token: ${{ secrets.HERRINGBONE_ACTIONS_BOT }}
          service_name: ${{ inputs.service_name }}
          short_sha: ${{ steps.meta.outputs.short_sha }}
          image_repo: ${{ inputs.image_repo }}
          image_tag: ${{ steps.meta.outputs.short_sha }}
          image_digest: ${{ steps.image.outputs.digest }}
          kustomization_path: ${{ inputs.kustomization_path }}
          package_path: ${{ inputs.package_path }}
          package_name: ${{ inputs.package_name }}
          package_version: ${{ steps.meta.outputs.package_version }}
          candidate_channel: ${{ inputs.candidate_channel }}
          candidate_tag: ${{ steps.meta.outputs.candidate_tag }}

      - name: Cleanup
        if: always()
        uses: ./.github/actions/docker-cleanup
