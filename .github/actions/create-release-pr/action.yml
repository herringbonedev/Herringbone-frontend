name: Create Release PR
description: Commit release updates and open a release PR.

inputs:
  token:
    required: true
  service_name:
    required: true
  release_version:
    required: true
  image_repo:
    required: true
  image_tag:
    required: true
  image_digest:
    required: true
  kustomization_path:
    required: true
  package_path:
    required: false
    default: ""
  package_name:
    required: false
    default: ""
  package_version:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Create release pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        BRANCH="release/${{ inputs.service_name }}-${{ inputs.release_version }}"
        BASE_BRANCH="${GITHUB_REF_NAME}"

        git checkout -B "$BRANCH"
        git add "${{ inputs.kustomization_path }}"

        if [ -n "${{ inputs.package_path }}" ]; then
          git add "${{ inputs.package_path }}/package.json" || true
          git add "${{ inputs.package_path }}/package-lock.json" || true
        fi

        if git diff --cached --quiet; then
          echo "No release changes to commit"
          exit 0
        fi

        git commit -s -m "chore(${{ inputs.service_name }}): release ${{ inputs.release_version }}"
        git push origin "$BRANCH" --force

        BODY_FILE="$(mktemp)"
        cat > "$BODY_FILE" <<EOF_BODY
        Full release for ${{ inputs.service_name }}.

        Version:
          ${{ inputs.release_version }}

        Image:
          ${{ inputs.image_repo }}:${{ inputs.image_tag }}@${{ inputs.image_digest }}

        Package:
          ${{ inputs.package_name }}@${{ inputs.package_version }}

        Source:
          ${GITHUB_SHA}

        Updated:
          - ${{ inputs.kustomization_path }}
        EOF_BODY

        if [ -n "${{ inputs.package_path }}" ]; then
          cat >> "$BODY_FILE" <<EOF_BODY
          - ${{ inputs.package_path }}/package.json
          - ${{ inputs.package_path }}/package-lock.json
        EOF_BODY
        fi

        EXISTING_PR="$(gh pr list \
          --head "$BRANCH" \
          --base "$BASE_BRANCH" \
          --state open \
          --json number \
          --jq '.[0].number // empty')"

        if [ -n "$EXISTING_PR" ]; then
          gh pr edit "$EXISTING_PR" \
            --title "chore(${{ inputs.service_name }}): release ${{ inputs.release_version }}" \
            --body-file "$BODY_FILE"
        else
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore(${{ inputs.service_name }}): release ${{ inputs.release_version }}" \
            --body-file "$BODY_FILE"
        fi
