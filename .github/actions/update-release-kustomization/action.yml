name: Update Release Kustomization
description: Update kustomization.yaml with release image tag and digest.

inputs:
  image_repo:
    required: true
  image_tag:
    required: true
  image_digest:
    required: true
  kustomization_path:
    required: true

outputs:
  changed:
    value: ${{ steps.diff.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Update kustomization image
      shell: bash
      run: |
        set -euo pipefail
        export IMAGE="${{ inputs.image_repo }}"
        export TAG="${{ inputs.image_tag }}"
        export DIGEST="${{ inputs.image_digest }}"

        if [ ! -f "${{ inputs.kustomization_path }}" ]; then
          echo "Missing kustomization file: ${{ inputs.kustomization_path }}"
          exit 1
        fi

        yq eval -i '(.images[] | select(.name == env(IMAGE))).newTag = env(TAG)' "${{ inputs.kustomization_path }}"
        yq eval -i '(.images[] | select(.name == env(IMAGE))).digest = env(DIGEST)' "${{ inputs.kustomization_path }}"

    - name: Detect kustomization changes
      id: diff
      shell: bash
      run: |
        set -euo pipefail
        if git diff --quiet -- "${{ inputs.kustomization_path }}"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
