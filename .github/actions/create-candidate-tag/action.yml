name: Create Candidate Tag
description: Create and push the candidate git tag for the source commit.

inputs:
  tag_name:
    required: true
  service_name:
    required: true
  package_name:
    required: false
    default: ""
  package_version:
    required: false
    default: ""
  image_repo:
    required: true
  image_tag:
    required: true
  image_digest:
    required: true

outputs:
  tag_name:
    value: ${{ inputs.tag_name }}

runs:
  using: composite
  steps:
    - name: Create and push candidate tag
      shell: bash
      run: |
        set -euo pipefail

        TAG_NAME="${{ inputs.tag_name }}"
        SERVICE_NAME="${{ inputs.service_name }}"
        PACKAGE_NAME="${{ inputs.package_name }}"
        PACKAGE_VERSION="${{ inputs.package_version }}"
        IMAGE="${{ inputs.image_repo }}:${{ inputs.image_tag }}@${{ inputs.image_digest }}"

        git fetch --tags --force origin >/dev/null 2>&1 || true

        if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG_NAME}")"
          if [ "$TAG_SHA" = "$GITHUB_SHA" ]; then
            echo "Candidate tag already exists on this commit: ${TAG_NAME}"
            exit 0
          fi
          echo "Candidate tag ${TAG_NAME} already exists on a different commit: ${TAG_SHA}"
          exit 1
        fi

        MESSAGE_FILE="$(mktemp)"
        printf '%s\n\nPackage: %s@%s\nImage: %s\nSource: %s\n' \
          "Candidate release for ${SERVICE_NAME}" \
          "$PACKAGE_NAME" \
          "$PACKAGE_VERSION" \
          "$IMAGE" \
          "$GITHUB_SHA" > "$MESSAGE_FILE"

        git tag -a "$TAG_NAME" -F "$MESSAGE_FILE" "$GITHUB_SHA"
        git push origin "refs/tags/${TAG_NAME}"
        rm -f "$MESSAGE_FILE"
