name: Release Metadata
description: Derive a full release version from a SHA candidate tag.

inputs:
  candidate_tag:
    required: true

outputs:
  candidate_tag:
    value: ${{ steps.meta.outputs.candidate_tag }}
  candidate_version:
    value: ${{ steps.meta.outputs.candidate_version }}
  release_version:
    value: ${{ steps.meta.outputs.release_version }}
  image_tag:
    value: ${{ steps.meta.outputs.image_tag }}

runs:
  using: composite
  steps:
    - name: Compute release metadata
      id: meta
      shell: bash
      run: |
        set -euo pipefail

        RAW_TAG="${{ inputs.candidate_tag }}"
        CANDIDATE_TAG="${RAW_TAG#refs/tags/}"
        CANDIDATE_VERSION="${CANDIDATE_TAG#v}"

        if [[ ! "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.[0-9a-fA-F]{7,40}$ ]]; then
          echo "candidate_tag must end with a short SHA candidate version, for example 0.4.0-alpha.fe4fe3a"
          exit 1
        fi

        RELEASE_VERSION="${CANDIDATE_VERSION%.*}"

        if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Derived release version is not valid SemVer: ${RELEASE_VERSION}"
          exit 1
        fi

        echo "candidate_tag=${CANDIDATE_TAG}" >> "$GITHUB_OUTPUT"
        echo "candidate_version=${CANDIDATE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "image_tag=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

        echo "Candidate tag: ${CANDIDATE_TAG}"
        echo "Candidate version: ${CANDIDATE_VERSION}"
        echo "Release version: ${RELEASE_VERSION}"
        echo "Image tag: ${RELEASE_VERSION}"
