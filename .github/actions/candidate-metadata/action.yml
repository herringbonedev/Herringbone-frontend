name: Candidate Metadata
description: Generate candidate release metadata from the current commit SHA.

inputs:
  candidate_base_version:
    required: true
  candidate_channel:
    required: true

outputs:
  short_sha:
    value: ${{ steps.meta.outputs.short_sha }}
  image_tag:
    value: ${{ steps.meta.outputs.image_tag }}
  package_version:
    value: ${{ steps.meta.outputs.package_version }}
  candidate_version:
    value: ${{ steps.meta.outputs.package_version }}
  candidate_tag:
    value: ${{ steps.meta.outputs.candidate_tag }}
  release_version:
    value: ${{ steps.meta.outputs.release_version }}

runs:
  using: composite
  steps:
    - name: Compute metadata
      id: meta
      shell: bash
      run: |
        set -euo pipefail

        BASE_VERSION="${{ inputs.candidate_base_version }}"
        CHANNEL="${{ inputs.candidate_channel }}"
        SHORT_SHA="${GITHUB_SHA::8}"
        IMAGE_TAG="${SHORT_SHA}"
        RELEASE_VERSION="${BASE_VERSION}-${CHANNEL}"
        PACKAGE_VERSION="${RELEASE_VERSION}.${SHORT_SHA}"
        CANDIDATE_TAG="${PACKAGE_VERSION}"

        if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "candidate_base_version must look like 0.4.0"
          exit 1
        fi

        if [[ ! "$CHANNEL" =~ ^[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
          echo "candidate_channel must be a valid SemVer prerelease identifier like alpha, beta, rc.1"
          exit 1
        fi

        echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
        echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "candidate_tag=${CANDIDATE_TAG}" >> "$GITHUB_OUTPUT"
        echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

        echo "Short SHA: ${SHORT_SHA}"
        echo "Image tag: ${IMAGE_TAG}"
        echo "Candidate version: ${PACKAGE_VERSION}"
        echo "Candidate tag: ${CANDIDATE_TAG}"
        echo "Release version blocked/derived: ${RELEASE_VERSION}"
