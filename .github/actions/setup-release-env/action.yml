name: Setup Release Environment
description: Configure git, Docker Buildx, yq, and registry login.

inputs:
  docker_username:
    required: true
  docker_password:
    required: true
  registry:
    required: false
    default: quay.io
  yq_version:
    required: false
    default: v4.44.3

runs:
  using: composite
  steps:
    - name: Configure git
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "herringbone-actions-bot"
        git config user.email "herringbone-actions-bot@users.noreply.github.com"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install yq
      shell: bash
      run: |
        set -euo pipefail
        sudo wget -qO /usr/local/bin/yq \
          "https://github.com/mikefarah/yq/releases/download/${{ inputs.yq_version }}/yq_linux_amd64"
        sudo chmod +x /usr/local/bin/yq
        yq --version

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}
