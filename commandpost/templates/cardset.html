<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CardSet • Minimal Admin</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; background:#0b0b0c; color:#e6e6e6; }
      h1 { margin:0 0 .6rem; font-size:1.4rem; }
      h2 { margin:1.2rem 0 .6rem; font-size:1.1rem; }
      .muted { color:#9aa0a6; }
      .wrap { max-width: 980px; }
      .row { display:flex; gap:.6rem; align-items:flex-end; flex-wrap:wrap; }
      .row > div { flex: 1; min-width: 180px; }
      label { display:block; font-size:.85rem; color:#9aa0a6; margin:.35rem 0 .15rem; }
      input, textarea { width:100%; padding:.6rem .7rem; border-radius:10px; border:1px solid #2a2a2a; background:#0f1115; color:#e6e6e6; }
      textarea { min-height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.92rem; }
      button { cursor:pointer; padding:.55rem .9rem; border-radius:10px; border:1px solid #2a2a2a; background:#17181c; color:#e6e6e6; }
      button.primary { background:#1c64ec; border-color:#1c64ec; }
      .table-wrap { border:1px solid #2a2a2a; border-radius:12px; overflow:auto; }
      table { width:100%; border-collapse:separate; border-spacing:0; font-size:.95rem; }
      th, td { padding:.6rem .7rem; border-bottom:1px solid #2a2a2a; vertical-align:top; }
      th { text-align:left; color:#9aa0a6; font-weight:600; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.9rem; }
      .chips span { display:inline-block; margin:.1rem .25rem; padding:.15rem .5rem; border:1px solid #2a2a2a; border-radius:999px; font-size:.8rem; }
      .note { font-size:.9rem; margin:.35rem 0; }
      .error { color:#ef4444; white-space:pre-wrap; }
      .success { color:#22c55e; }
    </style>
    <script>
      // If you render with FastAPI/Jinja, you can inject cardset_api; otherwise leave blank for same-origin
      window.__HB_CFG = { CARDSET_API: "{{ cardset_api | default('') }}" };
    </script>
  </head>
  <body>
    <div class="wrap">
      <h1>CardSet • Minimal Admin</h1>
      <p class="muted">List cards by selector, and add new cards. That’s it.</p>

      <!-- Load section -->
      <h2>Load Cards</h2>
      <div class="row">
        <div>
          <label for="selType">selector.type</label>
          <input id="selType" placeholder="e.g., domain">
        </div>
        <div>
          <label for="selValue">selector.value</label>
          <input id="selValue" placeholder="e.g., example.com">
        </div>
        <div style="max-width:140px;">
          <label for="limit">limit</label>
          <input id="limit" type="number" min="1" value="50">
        </div>
        <div style="max-width:160px;">
          <button id="btnLoad" class="primary" style="width:100%">Load</button>
        </div>
      </div>
      <div class="note muted">POST <code>/parser/cardset/pull_cards</code> with <code>{ selector_type, selector_value, limit? }</code>.</div>

      <!-- Results table -->
      <div class="table-wrap" style="margin-top:.6rem;">
        <table>
          <thead>
            <tr>
              <th>selector</th>
              <th>patterns</th>
              <th>last_updated</th>
            </tr>
          </thead>
          <tbody id="cardsBody">
            <tr><td colspan="3" class="muted" style="text-align:center;">No cards</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Create section -->
      <h2>Create Card</h2>
      <div class="note muted">POST <code>/parser/cardset/insert_card</code> with the full card JSON.</div>
      <label for="cardJson">card JSON</label>
      <textarea id="cardJson" placeholder='{"selector":{"type":"domain","value":"example.com"},"regex":[{"domain":"(?:[a-z0-9-]+\\.)*example\\.com"}]}'></textarea>
      <div class="row">
        <div style="max-width:160px;"><button id="btnCreate" class="primary" style="width:100%">Create</button></div>
        <div id="createMsg" class="note"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const BASE = (()=>{ const env=(window.__HB_CFG&&window.__HB_CFG.CARDSET_API||'').trim(); return (env||window.location.origin).replace(/\/$/,''); })();

      function prettySelector(s){ return s?`${s.type||''}:${s.value||''}`:''; }
      function renderRows(cards){
        const body=$('cardsBody'); body.innerHTML='';
        if(!cards||!cards.length){ body.innerHTML='<tr><td colspan="3" class="muted" style="text-align:center;">No cards</td></tr>'; return; }
        cards.forEach(c=>{
          const pats=[]; (c.regex||[]).forEach(kv=>{ const k=Object.keys(kv)[0]; pats.push(`<span class="chips"><span>/regex:${k}/</span></span>`); }); (c.jsonp||[]).forEach(kv=>{ const k=Object.keys(kv)[0]; pats.push(`<span class="chips"><span>$jsonpath:${k}</span></span>`); });
          const lu = c.last_updated ? new Date(c.last_updated.$date || c.last_updated).toISOString() : '';
          const tr=document.createElement('tr');
          tr.innerHTML = `<td><code>${prettySelector(c.selector)}</code></td><td>${pats.join(' ')||''}</td><td class="muted">${lu}</td>`;
          body.appendChild(tr);
        });
      }

      async function loadCards(){
        const selector_type=$('selType').value.trim();
        const selector_value=$('selValue').value.trim();
        const limit=Number($('limit').value)||undefined;
        const body={ selector_type, selector_value }; if(limit) body.limit=limit;
        try {
          const r=await fetch(`${BASE}/parser/cardset/pull_cards`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
          if(!r.ok) throw new Error(await r.text());
          const j=await r.json(); renderRows(j.cards||[]);
        } catch(e){ alert('Load failed: '+e.message); }
      }

      async function doCreate(){
        const raw=$('cardJson').value; let obj; try{ obj=JSON.parse(raw); }catch(e){ $('createMsg').textContent='Invalid JSON: '+e.message; $('createMsg').className='note error'; return; }
        try {
          const r=await fetch(`${BASE}/parser/cardset/insert_card`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)});
          const j=await r.json().catch(()=>({}));
          if(!r.ok) throw new Error(j.detail||'Insert failed');
          $('createMsg').textContent='Created.'; $('createMsg').className='note success';
          // If the new card matches the current filter, refresh list
          loadCards();
        } catch(e){ $('createMsg').textContent=e.message; $('createMsg').className='note error'; }
      }

      $('btnLoad').addEventListener('click', loadCards);
      $('btnCreate').addEventListener('click', doCreate);
    </script>
  </body>
</html>
