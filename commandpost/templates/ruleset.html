<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Commandpost</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles/commandpost.css') }}">
  </head>
  <body>
    <h1>
      <img src="{{ url_for('static', path='logo.png') }}"
           alt="Herringbone logo"
           style="height:2em; vertical-align:-0.25em; margin-right:.6rem;">
      Commandpost (Herringbone Alpha UI)
    </h1>
    <hr>
    <h2>Rules</h2>
    {% set rules = rule_rows or [] %}

    <div class="table-wrap">
      <table class="hb-table">
        <colgroup>
          <col class="col-type">
          <col class="col-name">
          <col class="col-prompt">
          <col class="col-data">
        </colgroup>

        <thead>
          <tr>
            <th>Type</th>
            <th>Name</th>
            <th>Prompt</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody>
          {% for r in rules if r %}
            {% set rule = r or {} %}
            <tr>
              <td><div class="truncate-1" title="{{ rule.get('type','') }}">{{ rule.get('type','') }}</div></td>
              <td><div class="truncate-1" title="{{ rule.get('name','') }}">{{ rule.get('name','') }}</div></td>
              <td>
                <div class="cell clamp-2" title="{{ rule.get('prompt','') }}">
                  {{ rule.get('prompt','') }}
                </div>
              </td>
              <td>
                <div class="cell code clamp-2" title="{{ rule.get('data') }}">
                  {{ rule.get('data') }}
                </div>
              </td>
            </tr>
          {% else %}
            <tr><td colspan="4" class="muted" style="text-align:center;">No rules</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
